upstream api {
    server api:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # 前端静态资源
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 代理 - 自动添加认证
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 自动添加 Basic Auth（从环境变量读取）
        proxy_set_header Authorization "Basic ${API_BASIC_AUTH}";
    }

    # WebSocket 支持
    location /ws/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 自动添加认证
        proxy_set_header Authorization "Basic ${API_BASIC_AUTH}";
    }

    # Health check（无需认证）
    location /health {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # API 文档
    location ~ ^/(docs|openapi.json|redoc) {
        proxy_pass http://api;
        proxy_set_header Host $host;

        # 文档也自动添加认证
        proxy_set_header Authorization "Basic ${API_BASIC_AUTH}";
    }
}
